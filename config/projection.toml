# Every modeling choice lives here. Change a value, re-run `project`.
# The CLI prints the active choices before it projects anything.

season = 2026

[source]
# "nflverse" (default): public nflverse CSV releases, structured play-by-play.
# "pfr": scrape Pro-Football-Reference HTML. PFR serves a Cloudflare bot check
#        to cloud machines, so this only works from a home connection.
provider = "nflverse"

[scrape]
delay_seconds = 4.0          # PFR only: PFR bans clients above ~20 requests/minute

[filters]
# Plays dropped before measuring tendencies (garbage time distorts play-calling).
garbage_time_quarter = 4
garbage_time_score_margin = 17
# "Neutral" situations used for pass rate: score within this margin, quarters 1-3.
neutral_score_margin = 8

[definitions]
# What counts as a "negative play" when deciding what a coach cuts:
#   "custom"  -> nets 0 or less (incl. incompletions, sacks), a turnover, or a
#                3rd/4th-down play that fails to convert (your definition)
#   "epa"     -> expected points added < 0 (uses PFR's EP before/after)
#   "success" -> fails the success-rate bar (40% / 60% / 100% of yards to go)
#   "loss"    -> lost yardage, sack, or turnover only
negative_play = "custom"
explosive_pass_yards = 20
explosive_run_yards = 10

[weighting]
# Exponential recency weighting: a game this many weeks old counts half.
half_life_weeks = 4.0

[adaptation]
# "Coaches cut what failed and do more of what worked."
# "measured" -> use the effect size estimated from this season's data, scaled
#               down when it is not statistically clear (recommended)
# "assume"   -> apply `assumed_strength` no matter what the data says
# "off"      -> ignore last week's results
mode = "measured"
assumed_strength = 0.5
# Minimum plays of a type in the last game before it can trigger an adjustment.
min_plays = 3

[matchup]
# How much the opponent's defense moves the projection. 0 = ignore opponent,
# 1 = fully trust the defense's allowed rates (after shrinkage).
defense_weight = 0.75
# Plays of evidence needed before a defense's rate is trusted at 50%.
# Higher = more regression to league average.
shrink_plays = 40
# Defense labels to use for "how offenses perform against different defenses":
#   "auto"   -> derive from scraped data (deep-pass allowed, 3rd-down pressure, run defense)
#   "manual" -> use data/manual/defense_tags.csv (your coverage / blitz labels)
#   "both"   -> manual where provided, auto otherwise
defense_labels = "both"

[players]
# Plays of evidence before a player's own per-target / per-carry rate is trusted at 50%.
shrink_targets = 25
shrink_carries = 40
# A player must have appeared in one of the team's last N games to be projected.
active_within_games = 2

[sim]
# Simulated games per matchup. Every prop (medians, ranges, longest plays,
# anytime TD, over/under vs your lines) is read off these simulations.
n_sims = 5000
seed = 0

[scheme]
# Online / tagged scheme data (data/external/defense_scheme.csv, data/manual/defense_tags.csv).
# Label thresholds, in percent of dropbacks.
blitz_heavy_pct = 33.0
blitz_light_pct = 20.0
man_heavy_pct = 30.0
man_light_pct = 18.0
# How much evidence (plays of THIS offense vs that scheme) before the
# offense-specific scheme effect is trusted at 50%.
shrink_plays = 40

[coach]
# Games of this season before the play-caller's career tendencies
# (pass lean, star reliance) count half. They fade as games accumulate.
prior_games = 3.0
# Volume spread multiplier for first-time / newly arrived play-callers.
new_caller_sd_mult = 1.15

[sos]
# Strength of schedule: re-rate each team's raw pass/run yards per play and
# points per game against the opponents it actually faced.
enabled = true
shrink_plays = 60.0          # ridge penalty for per-play ratings (plays)
shrink_games = 3.0           # ridge penalty for points ratings (games)
min_factor = 0.85            # cap on how far schedule can move an input
max_factor = 1.15

[market]
# Betting-market team totals (closing spread and over/under from nflverse).
enabled = true
# Share of the projected team total taken from the market (rest = model).
weight = 0.6
# Teams that keep missing (or beating) their implied totals: the average miss
# counts this many games of evidence before it is trusted at 50%.
miss_shrink_games = 6.0
# Yardage moves less than scoring: yards factor = TD factor ^ this.
yards_elasticity = 0.3
# Dropback rate change per point of spread (favorites run more).
pass_rate_per_point = 0.004
min_factor = 0.6
max_factor = 1.6

[availability]
# Injury report + depth chart -> automatic outs and starting QB.
# data/manual/player_overrides.csv always wins.
doubtful_plays = false
