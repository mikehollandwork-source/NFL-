# Every modeling choice lives here. Change a value, re-run `project`.
# The CLI prints the active choices before it projects anything.

season = 2026

[source]
# "nflverse" (default): public nflverse CSV releases, structured play-by-play.
# "pfr": scrape Pro-Football-Reference HTML. PFR serves a Cloudflare bot check
#        to cloud machines, so this only works from a home connection.
provider = "nflverse"

[scrape]
delay_seconds = 4.0          # PFR only: PFR bans clients above ~20 requests/minute

[filters]
# Plays dropped before measuring tendencies (garbage time distorts play-calling).
garbage_time_quarter = 4
garbage_time_score_margin = 17
# "Neutral" situations used for pass rate: score within this margin, quarters 1-3.
neutral_score_margin = 8

[definitions]
# What counts as a "negative play" when deciding what a coach cuts:
#   "custom"  -> nets 0 or less (incl. incompletions, sacks), a turnover, or a
#                3rd/4th-down play that fails to convert (your definition)
#   "epa"     -> expected points added < 0 (uses PFR's EP before/after)
#   "success" -> fails the success-rate bar (40% / 60% / 100% of yards to go)
#   "loss"    -> lost yardage, sack, or turnover only
negative_play = "custom"
explosive_pass_yards = 20
explosive_run_yards = 10

[weighting]
# Exponential recency weighting: a game this many weeks old counts half.
half_life_weeks = 4.0

[adaptation]
# "Coaches cut what failed and do more of what worked."
# "measured" -> use the effect size estimated from this season's data, scaled
#               down when it is not statistically clear (recommended)
# "assume"   -> apply `assumed_strength` no matter what the data says
# "off"      -> ignore last week's results
mode = "measured"
assumed_strength = 0.5
# Minimum plays of a type in the last game before it can trigger an adjustment.
min_plays = 3

[matchup]
# How much the opponent's defense moves the projection. 0 = ignore opponent,
# 1 = fully trust the defense's allowed rates (after shrinkage).
defense_weight = 0.75
# Plays of evidence needed before a defense's rate is trusted at 50%.
# Higher = more regression to league average.
shrink_plays = 40
# Defense labels to use for "how offenses perform against different defenses":
#   "auto"   -> derive from scraped data (deep-pass allowed, 3rd-down pressure, run defense)
#   "manual" -> use data/manual/defense_tags.csv (your coverage / blitz labels)
#   "both"   -> manual where provided, auto otherwise
defense_labels = "both"

[players]
# Plays of evidence before a player's own per-target / per-carry rate is trusted at 50%.
shrink_targets = 25
shrink_carries = 40
# A player must have appeared in one of the team's last N games to be projected.
active_within_games = 2

[sim]
# Simulated games per matchup. Every prop (medians, ranges, longest plays,
# anytime TD, over/under vs your lines) is read off these simulations.
n_sims = 5000
seed = 0

[scheme]
# Online / tagged scheme data (data/external/defense_scheme.csv, data/manual/defense_tags.csv).
# Label thresholds, in percent of dropbacks.
blitz_heavy_pct = 33.0
blitz_light_pct = 20.0
man_heavy_pct = 30.0
man_light_pct = 18.0
# How much evidence (plays of THIS offense vs that scheme) before the
# offense-specific scheme effect is trusted at 50%.
shrink_plays = 40

[coach]
# Games of this season before the play-caller's career tendencies
# (pass lean, star reliance) count half. They fade as games accumulate.
prior_games = 3.0
# Volume spread multiplier for first-time / newly arrived play-callers.
new_caller_sd_mult = 1.15

[sos]
# Strength of schedule: re-rate each team's raw pass/run yards per play and
# points per game against the opponents it actually faced.
enabled = true
shrink_plays = 60.0          # ridge penalty for per-play ratings (plays)
shrink_games = 3.0           # ridge penalty for points ratings (games)
min_factor = 0.85            # cap on how far schedule can move an input
max_factor = 1.15

[market]
# The betting market is NOT used for any projection. It is used only to
# grade paper trades (lines and odds recorded at lock and at close).
# enabled = true would blend implied team totals into scoring (kept for
# comparison runs only).
enabled = false
hit_tolerance = 4.0
min_hit_rate = 0.6
min_games = 4
weight = 0.6
miss_shrink_games = 6.0
yards_elasticity = 0.3
min_factor = 0.6
max_factor = 1.6

[availability]
# Injury report + depth chart -> automatic outs and starting QB.
# data/manual/player_overrides.csv always wins.
doubtful_plays = false

[corners]
# Cornerback matchups (PFR coverage charting + depth chart + researched
# shadow corners in data/external/defense_personnel.csv).
enabled = true
shrink_targets = 30.0        # targets before a corner's own yds/target is trusted at 50%
replacement_ypt_mult = 1.08  # an out corner's targets go to a replacement this much worse than league
shadow_share = 0.7           # share of WR1's routes spent against an active shadow corner
te_weight = 0.5              # tight ends get this share of the corner-group effect
min_factor = 0.8
max_factor = 1.2

[script]
# Game script from the model's own projected margin (used when [market] is off):
# the team projected to lead passes less, the trailing team passes more.
enabled = true
pass_rate_per_point = 0.004

[defense]
# Position-group weakness (WR / TE / RB) and struggle-week diagnosis.
shrink_targets = 40.0        # targets vs a position group before the split is trusted at 50%
struggle_epa = 0.12          # a "struggle" = EPA/play allowed this much above the defense's other games
absent_game_weight = 0.5     # weight of a struggle game played without starters who are back now
min_factor = 0.8
max_factor = 1.25

[comps]
# Similar offenses (structure, not results) and how they fared vs this defense.
enabled = true
bandwidth = 0.6              # smaller = only very close offenses count
shrink_games = 2.0           # weighted games of evidence before the effect is trusted at 50%
min_factor = 0.88
max_factor = 1.12

[picks]
min_games = 3                # games played this season to qualify
min_prob = 0.55              # simulated chance of beating the baseline in the pick's direction
min_edge = 0.06              # ...and how much of that comes from the projection (skew removed)
min_targets = 4.0            # usage floor per game for receiving picks
min_carries = 8.0            # usage floor per game for rushing picks
min_signals = 2              # independent signals that must agree
per_game = 5
star_target_share = 0.25     # "consistent action" exemption from the usage-trend rule
star_carry_share = 0.55
star_cv = 0.35               # max game-to-game variation in usage for the exemption

[priors]
# Last season's team rates, regressed toward league average, as the
# starting point that this season's games gradually replace.
season = 2025
enabled = true
regress = 0.5                # keep this share of a team's 2025 edge over league (offense)
regress_new_caller = 0.3     # ...for offenses with a new play-caller
regress_defense = 0.4
volume_prior_games = 3.0     # plays per game: 2025 counts as this many games

[player_adaptation]
# Per player: play types (buckets) that failed for him last game are cut by
# their failure rate (custom negative-play rule) and his volume moves to the
# play types that worked; his total volume is unchanged. The team's play mix
# is rebuilt from the players' plans, and the defense's numbers on those
# play types decide what they're worth.
#   "assume"   -> cut = the value below (1.0 = cancel what failed)
#   "measured" -> estimate the cut from this season's data
#   "off"      -> no player-level adaptation
mode = "measured"
cut = 1.0
min_plays = 1                # plays of a type last game before it can be cut
play_level = true            # judge kept plays by their exact kind (play action, screens) vs this defense

[weather]
# Wind / cold / rain effects measured from 2025-26 outdoor games; forecasts
# from the National Weather Service (Open-Meteo abroad). Domes and
# retractable roofs: no effect.
enabled = true

[oline]
# Missing starting offensive linemen: per-starter effects measured from
# 2025-26 team-games, applied for starters listed out this week.
enabled = true

[streaks]
# Regression after hot / cold streaks. The share of a two-game streak that
# carries into the next game is measured on last season (efficiency and
# volume separately) and only that share is kept. Long plays are capped
# when measuring a player's efficiency (they mostly don't repeat).
enabled = true
# "equal_weight": a player's efficiency weights every game the same (recent
#                 hot games get no extra weight) with long plays capped
# "factor":       keep only the measured share of the last two games' streak
method = "equal_weight"
cap_rec_yards = 40.0
cap_rush_yards = 30.0

[volume]
# How each team's plays are projected.
#   "clock" (default): drives come from the shared game clock (both teams'
#           pace and plays per drive); plays = drives x plays per drive.
#           Possession share falls out of it. See nfl_proj/clock.py.
#   "average": the team's plays per game x the opponent's plays allowed.
method = "clock"
ppd_shrink_games = 8.0       # plays per drive barely repeats: shrink hard
pace_shrink_games = 3.0
pace_prior_regress = 0.7     # 2025 pace kept at 70% as the starting point

[odds]
# Player prop lines and prices for paper trading, from The Odds API
# (free key at https://the-odds-api.com; set ODDS_API_KEY). Cost on the free
# tier (500 credits/month) = markets x events per pull; 5 markets x ~14
# games x 2 pulls (lock + close) ~ 140 per week.
markets = ["player_pass_yds", "player_pass_completions", "player_receptions", "player_reception_yds",
           "player_rush_attempts"]
regions = "us"
book = "draftkings"          # price to trade at; falls back to the first book with the line

[paper]
# Paper trading. Probabilities are calibrated first: the backtest showed
# the model overconfident (an 80% call hit ~68%):
#   p = sigmoid(calib_a + calib_b * logit(model probability))
# Refit as graded paper trades accumulate (`paper-summary` reports it).
calib_a = 0.13
calib_b = 0.45
# Props the backtest found no skill on are skipped (rushing yards: 44%
# hit, -6 points vs no-information on 25 calls).
exclude_stats = ["rush_yds"]
min_ev = 0.03                # expected value per unit staked at the posted price
min_prob = 0.54              # calibrated probability floor
kelly_fraction = 0.25        # quarter Kelly on the calibrated probability
max_stake = 1.5              # units
min_stake = 0.5
max_per_game = 2             # correlated outcomes: cap exposure per game
max_per_team_side = 1        # no stacking two same-team props in the same direction
max_bets = 15
require_usage_trend = true   # your rule: overs need rising usage, unders falling (stars / QBs exempt)
